<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Envman terminal UI preview</title>
  <desc id="desc">A sample Envman variable catalog with a focused project path, masked API token, selection count, details, and keyboard controls.</desc>
  <metadata>
    <dc:title>Envman terminal UI preview</dc:title>
    <dc:creator>Crux Experts LLC</dc:creator>
    <dc:source>https://www.cruxexperts.com/</dc:source>
